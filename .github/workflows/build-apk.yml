name: Build Release APK (GoydaShagomer)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Keystore for V2 + V3 Release Signing
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "KEYSTORE_PATH=${PWD}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          elif [ -f "debug.keystore.base64" ]; then
            echo "Decoding fallback keystore..."
            base64 -d debug.keystore.base64 > debug.keystore
            echo "KEYSTORE_PATH=${PWD}/debug.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          else
            echo "Generating self-signed release keystore for V2+V3 signing..."
            keytool -genkey -v -keystore my-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 \
              -alias upload -storepass android -keypass android \
              -dname "CN=GoydaShagomer, OU=Nondiat, O=Nondiat, L=City, S=State, C=US"
            echo "KEYSTORE_PATH=${PWD}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=upload" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Build Release APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon
          else
            gradle assembleRelease --no-daemon
          fi

      - name: Sign & Align APK with V2 + V3 Signature Scheme
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)

          echo "Found compiled APK: $APK_PATH"
          echo "Using Android Build-Tools: $BUILD_TOOLS_DIR"

          # Zipalign APK
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$APK_PATH" GoydaShagomer.apk

          # Sign with apksigner enforcing V2 and V3 signing schemes
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out GoydaShagomer.apk \
            GoydaShagomer.apk

          # Verify V2 + V3 signature
          $BUILD_TOOLS_DIR/apksigner verify --verbose GoydaShagomer.apk

          # Duplicate as versioned file name
          cp GoydaShagomer.apk GoydaShagomer-v1.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoydaShagomer-APK
          path: |
            GoydaShagomer.apk
            GoydaShagomer-v1.1.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GoydaShagomer.apk
            GoydaShagomer-v1.1.apk
          name: Goyda shagomer v1.1
          body: |
            ## Release v1.1 - Goyda shagomer
            - Package Name: `com.goydashagomer.nondiat`
            - Version: 1.1 (build 2)
            - Material You Dynamic Colors & Adaptive Widget 2x2
            - V2 + V3 Signed APK
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
